<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!--
    Das Zeichen des Fundaments: drei Schichten, die unterste am breitesten.

    Nur Formen, kein Text. Ein SVG, das ueber link rel=icon hereinkommt, ist
    ein eigenes Dokument: Es sieht die Schriften der Seite nicht, kennt ihre
    CSS-Variablen nicht und erbt keine Textfarbe. Deshalb stehen die Farben
    hier als feste Werte, gespiegelt aus den Marken-Token.

    Gerechnet fuer 16 Pixel: Die Luecken sind zwei Einheiten breit, damit sie
    beim Glaetten nicht zulaufen, und keine Flaeche liegt unter 0.3 Deckkraft.

    (In XML-Kommentaren ist kein doppelter Bindestrich erlaubt; Token-Namen
    werden hier deshalb umschrieben.)
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2b8fe0" />
      <stop offset="1" stop-color="#2b3b8f" />
    </linearGradient>
  </defs>

  <rect width="24" height="24" rx="5" fill="url(#ground)" />

  <g fill="#ffffff">
    <rect x="5" y="14.5" width="14" height="3.5" rx="1.2" />
    <rect x="7" y="9.5" width="10" height="3.5" rx="1.2" opacity="0.75" />
    <rect x="9" y="4.5" width="6" height="3.5" rx="1.2" opacity="0.5" />
  </g>
</svg>
